<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECTOR - Family View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .map-bg {
            background-color: #1a202c;
            background-image: 
                linear-gradient(#2d3748 2px, transparent 2px),
                linear-gradient(90deg, #2d3748 2px, transparent 2px);
            background-size: 40px 40px;
        }
        .dot { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); transition: all 1s linear; }
        .user-dot { width: 20px; height: 20px; background-color: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        .drone-dot { width: 30px; height: 30px; background-color: #ef4444; box-shadow: 0 0 20px #ef4444; flex-direction: column;}
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8 flex flex-col max-w-5xl mx-auto w-full relative">
    <video autoplay loop muted playsinline class="fixed inset-0 w-full h-full object-cover opacity-10 pointer-events-none z-[-2]">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-drone-flying-over-a-city-at-night-24209-large.mp4" type="video/mp4">
    </video>
    <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-[2px] pointer-events-none z-[-1]"></div>

    <header class="mb-6 bg-gray-800/90 backdrop-blur-xl p-8 rounded-3xl border border-gray-700 flex justify-between items-center shadow-2xl">
        <div>
            <h1 class="text-3xl font-black text-blue-400 tracking-wider">Family Monitoring</h1>
            <p class="text-sm text-gray-400 mt-2 font-mono uppercase">Monitoring: <span id="uName" class="font-bold text-white text-lg ml-2">...</span></p>
        </div>
        <div class="bg-green-500/10 text-green-400 px-6 py-3 rounded-full border border-green-500/30 text-sm font-black uppercase tracking-widest flex items-center gap-3 shadow-inner">
            <span class="w-3 h-3 rounded-full bg-green-400 animate-pulse shadow-[0_0_10px_#4ade80]"></span>
            Status: Protected
        </div>
    </header>

    <main class="flex-1 relative border-4 border-gray-700 rounded-3xl overflow-hidden map-bg shadow-[inset_0_0_50px_rgba(0,0,0,0.8)] min-h-[50vh]">
        <div id="uDot" class="dot user-dot opacity-0 z-20 flex items-center justify-center text-[10px] font-bold">👤</div>
        <div id="dDot" class="dot drone-dot opacity-0 z-30 flex items-center justify-center text-sm shadow-xl">🚁</div>
        <div id="msg" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 bg-gray-900/80 backdrop-blur-sm z-50">
            <span class="text-5xl mb-4">🌍</span>
            <span class="font-medium tracking-widest uppercase">No active trip right now. Waiting for SOS...</span>
        </div>
    </main>

    <footer class="mt-8 flex gap-4">
        <a href="dashboard.html" class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-600 text-center py-5 rounded-2xl font-black tracking-widest uppercase transition shadow-lg text-lg">Close Portal</a>
    </footer>

    <script>
        const userData = JSON.parse(localStorage.getItem("userData") || "{}");
        if(userData.name) document.getElementById('uName').innerText = userData.name;

        function updateView() {
            const tripData = JSON.parse(localStorage.getItem("tripData"));
            if(!tripData || tripData.status !== "Active") {
                document.getElementById('msg').classList.remove('hidden');
                document.getElementById('uDot').style.opacity = 0;
                document.getElementById('dDot').style.opacity = 0;
                return;
            }
            document.getElementById('msg').classList.add('hidden');
            document.getElementById('uDot').style.opacity = 1;
            document.getElementById('dDot').style.opacity = 1;

            document.getElementById('uDot').style.left = tripData.userX + '%';
            document.getElementById('uDot').style.top = tripData.userY + '%';
            document.getElementById('dDot').style.left = tripData.droneX + '%';
            document.getElementById('dDot').style.top = tripData.droneY + '%';
        }

        setInterval(updateView, 1000);
        updateView();
    </script>
</body>
</html>
