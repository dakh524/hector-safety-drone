<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECTOR - Police Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8 flex flex-col items-center justify-center relative">
    <video autoplay loop muted playsinline class="fixed inset-0 w-full h-full object-cover opacity-10 pointer-events-none z-[-2]">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-drone-flying-over-a-city-at-night-24209-large.mp4" type="video/mp4">
    </video>
    <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-[2px] pointer-events-none z-[-1]"></div>

    <div class="w-full max-w-xl bg-gray-800/90 backdrop-blur-xl rounded-3xl border-2 border-blue-900 shadow-[0_0_60px_rgba(0,0,0,0.8)] p-10 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 via-red-500 to-blue-600"></div>
        
        <div class="flex justify-between items-start mb-12 mt-2">
            <div>
                <h1 class="text-4xl font-black text-blue-400 tracking-widest drop-shadow-md">POLICE DISPATCH</h1>
                <p class="text-sm text-gray-400 mt-2 bg-gray-900 px-3 py-1 rounded inline-block font-mono">NODE #442 / SECURE CONNECTION</p>
            </div>
            <div class="w-16 h-16 bg-blue-900/50 rounded-2xl flex items-center justify-center border-2 border-blue-700 text-3xl shadow-[0_0_20px_rgba(37,99,235,0.6)]">
                🛡️
            </div>
        </div>

        <div class="bg-gray-900 rounded-2xl p-8 border border-gray-700 mb-10 font-mono text-lg shadow-inner">
            <div class="grid grid-cols-2 gap-8">
                <div>
                    <span class="text-gray-500 block mb-2 uppercase text-sm tracking-widest">Active Drone</span>
                    <span id="pDrone" class="text-white font-bold text-2xl">--</span>
                </div>
                <div>
                    <span class="text-gray-500 block mb-2 uppercase text-sm tracking-widest">User Name</span>
                    <span id="pUser" class="text-white font-bold text-2xl">--</span>
                </div>
                <div>
                    <span class="text-gray-500 block mb-2 uppercase text-sm tracking-widest">Battery</span>
                    <span id="pBatt" class="text-yellow-400 font-black text-2xl">--</span>
                </div>
                <div>
                    <span class="text-gray-500 block mb-2 uppercase text-sm tracking-widest">Signal</span>
                    <span class="text-green-400 font-bold text-xl flex items-center gap-3 mt-1">
                        <span class="flex gap-1">
                            <span class="w-1.5 h-3 bg-green-400"></span>
                            <span class="w-1.5 h-4 bg-green-400"></span>
                            <span class="w-1.5 h-5 bg-green-400"></span>
                        </span> Strong
                    </span>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <button onclick="triggerSiren()" class="w-full bg-gradient-to-r from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 py-5 rounded-2xl font-black tracking-[0.2em] transition flex justify-center items-center gap-3 shadow-[0_0_30px_rgba(220,38,38,0.4)] border-2 border-red-500 text-xl">
                🚨 OVERRIDE SIREN
            </button>
            <div class="flex gap-4">
                <button onclick="alert('Alert dispatched to nearest patrol unit.')" class="flex-1 bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition text-lg tracking-wide border border-blue-400">
                    Dispatch Patrol
                </button>
                <button onclick="alert('Manual override engaged. Drone control transferred to dispatch console.')" class="flex-1 bg-gray-700 hover:bg-gray-600 border border-gray-500 py-4 rounded-xl font-bold transition text-lg tracking-wide">
                    Manual Control
                </button>
            </div>
        </div>
        
        <div class="mt-10 text-center">
            <a href="dashboard.html" class="text-gray-500 hover:text-white underline font-medium transition tracking-widest uppercase text-sm">Close Secure Session</a>
        </div>
    </div>

    <script>
        function updateData() {
            const userData = JSON.parse(localStorage.getItem("userData") || "{}");
            const droneData = JSON.parse(localStorage.getItem("droneData") || "{}");
            const tripData = JSON.parse(localStorage.getItem("tripData") || "{}");
            
            if(userData.name) document.getElementById('pUser').innerText = userData.name;
            if(droneData.id) document.getElementById('pDrone').innerText = droneData.id;
            
            if(tripData && tripData.status === "Active") {
                document.getElementById('pBatt').innerText = (tripData.battery || droneData.battery || 0).toFixed(1) + "%";
            } else {
                document.getElementById('pBatt').innerText = "Standby";
            }
        }

        setInterval(updateData, 2000);
        updateData();

        function triggerSiren() {
            const flags = JSON.parse(localStorage.getItem("flags") || "{}");
            flags.siren = true;
            localStorage.setItem("flags", JSON.stringify(flags));
            alert("Override successful. Drone siren activated.");
        }
    </script>
</body>
</html>
