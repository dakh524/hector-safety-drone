<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECTOR - Safe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 md:p-12 rounded-3xl w-full max-w-lg text-center border border-gray-700 shadow-[0_0_60px_rgba(0,0,0,0.8)] relative overflow-hidden">
        <div class="absolute inset-0 bg-blue-500/10 blur-3xl pointer-events-none"></div>
        <div class="relative z-10">
            <div class="w-36 h-36 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-8 border-4 border-blue-400/50 shadow-[0_0_50px_rgba(59,130,246,0.6)]">
                <span class="text-7xl drop-shadow-xl">🛡️</span>
            </div>
            
            <h1 class="text-4xl md:text-5xl font-black mb-6 text-white uppercase tracking-widest drop-shadow-md leading-tight">You are safe<br><span class="text-blue-400">with us</span></h1>
            
            <div class="bg-gray-900/80 p-6 rounded-2xl border border-blue-900/50 mb-10 shadow-inner">
                <p class="text-blue-300 font-medium italic text-xl leading-relaxed">"Women are powerful,<br>Safety gives them wings."</p>
            </div>
            
            <div class="bg-gray-800 p-8 rounded-2xl mb-10 grid gap-5 text-left border border-gray-600 shadow-xl" id="stats">
                <!-- Stats injected here -->
            </div>
            
            <a href="dashboard.html" class="block w-full bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 text-white font-black tracking-widest py-6 rounded-2xl transition shadow-[0_0_30px_rgba(37,99,235,0.5)] text-xl border-2 border-blue-400">RETURN TO HUB</a>
        </div>
    </div>
    <script>
        const history = JSON.parse(localStorage.getItem("historyData") || "[]");
        if(history.length > 0) {
            const lastTrip = history[0];
            document.getElementById('stats').innerHTML = `
                <div class="flex justify-between items-center border-b border-gray-700 pb-4">
                    <span class="text-gray-400 font-bold uppercase text-sm tracking-wider">Time Taken</span> 
                    <span class="font-black text-2xl text-white">${lastTrip.timeTaken}</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-700 py-4">
                    <span class="text-gray-400 font-bold uppercase text-sm tracking-wider">Distance</span> 
                    <span class="font-black text-2xl text-white">${lastTrip.distance}</span>
                </div>
                <div class="flex justify-between items-center pt-4 border-b border-gray-700 pb-4">
                    <span class="text-gray-400 font-bold uppercase text-sm tracking-wider">Safety Score</span> 
                    <span class="text-green-400 font-black text-4xl drop-shadow-lg">${lastTrip.score}%</span>
                </div>
                <div class="flex justify-between items-center pt-4">
                    <span class="text-gray-400 font-bold uppercase text-sm tracking-wider">Drone ID</span> 
                    <span class="text-blue-400 font-mono font-bold text-xl">${lastTrip.droneID}</span>
                </div>
            `;
        }
    </script>
</body>
</html>
